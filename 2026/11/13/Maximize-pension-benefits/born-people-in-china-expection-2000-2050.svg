<text x="84" y="638" font-size="11.5" fill="#7a879c">数据来源：联合国《世界人口展望 2024》中方案（population.un.org/wpp，经 Our World in Data 整理）；</text>
<text x="84" y="655" font-size="11.5" fill="#7a879c">　　　　　国家统计局 2024 年数据（2025-01-17 发布）、2025 年统计公报（2026-02-28）。</text>
<text x="84" y="672" font-size="11.5" fill="#7a879c">注意：WPP 2024 中 2024、2025 年仍为预测值（882 万、871 万），实际为 954 万、792 万；</text>
<text x="84" y="689" font-size="11.5" fill="#7a879c">　　　联合国估计与统计局口径存在差异，曲线水平值以联合国口径为准，趋势比绝对值可靠。</text>
